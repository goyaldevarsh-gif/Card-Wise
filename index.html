<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CardWise</title>
<meta name="theme-color" content="#2E2C87">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CardWise">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7;
    --surface:#FFFFFF;
    --ink:#15151F;
    --ink-soft:#5D5D6E;
    --border:#E7E6E1;
    --primary:#2E2C87;
    --primary-ink:#FFFFFF;
    --accent:#12B76A;
    --accent-soft:#E7F8EF;
    --warn:#F97316;
    --warn-soft:#FFF1E6;
    --radius:16px;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131319; --surface:#1C1C26; --ink:#F2F2F5; --ink-soft:#A3A3B2;
      --border:#2C2C38; --primary:#8C8AFF; --primary-ink:#131319;
      --accent:#3ADE8B; --accent-soft:#123324; --warn:#FFB067; --warn-soft:#3A2612;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Plus Jakarta Sans', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding: calc(env(safe-area-inset-top,0px) + 18px) 18px 10px;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; background:var(--primary);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{ width:20px; height:20px; }
  .brand-name{ font-size:20px; font-weight:800; letter-spacing:-0.02em; }
  .brand-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:-2px; }

  .tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .tab-btn{
    flex:1; padding:10px; border-radius:11px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--ink-soft); font-family:'Inter'; font-weight:700;
    font-size:13.5px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }

  .search-wrap{ position:relative; }
  .search-wrap input{
    width:100%; padding:13px 44px 13px 16px; border-radius:13px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--ink);
    font-family:'Inter'; font-size:15px; outline:none;
  }
  .search-wrap input:focus{ border-color:var(--primary); }
  .search-wrap .clear-btn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border:none; background:transparent; color:var(--ink-soft);
    font-size:18px; cursor:pointer; display:none;
  }
  .search-wrap.has-val .clear-btn{ display:block; }

  main{ padding: 14px 18px 110px; max-width:640px; margin:0 auto; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state .glyph{ font-size:34px; margin-bottom:10px; }
  .empty-state p{ font-size:14px; margin:4px 0; }

  .section{ margin-bottom:22px; }
  .section-title{
    font-size:12.5px; font-weight:700; text-transform:none; letter-spacing:0.01em;
    color:var(--ink-soft); margin:0 0 8px 4px;
  }

  .item{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 14px; margin-bottom:9px; cursor:pointer;
    transition:border-color .12s ease;
  }
  .item:active{ border-color:var(--primary); }
  .item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .item-name{ font-size:15px; font-weight:600; line-height:1.35; }
  .item-badge{
    flex-shrink:0; font-size:11.5px; font-weight:700; padding:5px 9px; border-radius:20px;
    background:var(--accent-soft); color:var(--accent); white-space:nowrap;
  }
  .item-mode{ font-size:13.5px; color:var(--ink-soft); margin-top:5px; }
  .item-mode b{ color:var(--ink); font-weight:600; }
  .item-note{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.4; }
  .custom-tag{
    display:inline-block; font-size:10.5px; font-weight:700; color:var(--warn);
    background:var(--warn-soft); padding:2px 7px; border-radius:20px; margin-left:6px;
  }

  .result-card{
    background:var(--surface); border:1.5px solid var(--border); border-radius:20px;
    padding:20px 18px; margin-bottom:12px; cursor:pointer;
    transition:border-color .12s ease;
  }
  .result-card:first-child{ border-color:var(--primary); border-width:2px; }
  .result-card:active{ border-color:var(--primary); }
  .result-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .result-mode{
    font-family:'Plus Jakarta Sans', sans-serif; font-size:21px; font-weight:800;
    letter-spacing:-0.01em; line-height:1.2; color:var(--primary);
  }
  .result-for{ font-size:13px; color:var(--ink-soft); margin-top:7px; font-weight:500; }
  .result-card .item-note{ font-size:12px; margin-top:8px; }

  .fab{
    position:fixed; right:18px; bottom:calc(22px + env(safe-area-inset-bottom,0px));
    width:56px; height:56px; border-radius:50%; background:var(--primary); color:var(--primary-ink);
    border:none; font-size:28px; line-height:56px; text-align:center; cursor:pointer;
    box-shadow:0 8px 24px rgba(46,44,135,0.35); z-index:30;
  }
  .fab:active{ transform:scale(0.94); }

  /* Modal / sheet */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(10,10,20,0.45); z-index:40;
    display:none; align-items:flex-end;
  }
  .sheet-backdrop.open{ display:flex; }
  .sheet{
    background:var(--surface); width:100%; max-width:640px; margin:0 auto;
    border-radius:22px 22px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    max-height:88vh; overflow-y:auto;
    animation:slideUp .18s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0.4; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:38px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 16px; }
  .sheet h2{ font-size:18px; margin:0 0 16px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field textarea, .field select{
    width:100%; padding:11px 13px; border-radius:11px; border:1.5px solid var(--border);
    background:var(--bg); color:var(--ink); font-family:'Inter'; font-size:14.5px; outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--primary); }
  .field textarea{ resize:vertical; min-height:56px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; padding:13px; border-radius:12px; border:none; font-size:14.5px; font-weight:700;
    font-family:'Inter'; cursor:pointer;
  }
  .btn-primary{ background:var(--primary); color:var(--primary-ink); }
  .btn-ghost{ background:var(--bg); color:var(--ink); border:1.5px solid var(--border); }
  .btn-danger{ background:var(--warn-soft); color:var(--warn); }
  .btn:active{ transform:scale(0.97); }

  .toast{
    position:fixed; left:50%; bottom:calc(100px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg);
    padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:all .2s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .lightbox{
    position:fixed; inset:0; background:rgba(8,8,16,0.92); z-index:60;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:80vh; border-radius:14px; }
  .lightbox-close{
    position:absolute; top:calc(18px + env(safe-area-inset-top,0px)); right:18px;
    width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,0.15);
    color:#fff; font-size:22px; cursor:pointer;
  }
  .tile-img-wrap{ position:relative; }
  .tile-view-btn{
    position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%;
    background:rgba(0,0,0,0.55); color:#fff; border:none; font-size:13px; display:flex;
    align-items:center; justify-content:center; cursor:pointer;
  }

  .top-note{
    background:var(--accent-soft); color:var(--accent); border-radius:12px; padding:10px 13px;
    font-size:12.5px; margin-bottom:16px; line-height:1.4; font-weight:500;
  }

  /* My Cards wallet */
  #cardsGrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    overflow:hidden; cursor:pointer;
  }
  .card-tile:active{ border-color:var(--primary); }
  .card-tile-img{
    width:100%; aspect-ratio:1.586/1; object-fit:cover; display:block; background:var(--primary);
  }
  .card-tile-img.placeholder{
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;
    font-size:14px; text-align:center; padding:10px; background:linear-gradient(135deg,var(--primary),#4B49C4);
  }
  .card-tile-body{ padding:10px 12px 12px; }
  .card-tile-name{ font-size:13.5px; font-weight:700; line-height:1.3; }
  .card-tile-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .card-tile-fee{ font-size:11px; color:var(--ink-soft); margin-top:5px; }
  .card-tile-fee b{ color:var(--accent); }

  .add-card-tile{
    border:1.5px dashed var(--border); border-radius:18px; aspect-ratio:1.05/1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--ink-soft); cursor:pointer; gap:6px; background:transparent;
  }
  .add-card-tile .plus{ font-size:26px; color:var(--primary); }
  .add-card-tile span{ font-size:12px; font-weight:600; }

  .photo-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:16px;
  }
  .photo-thumb{
    position:relative; aspect-ratio:1.586/1; border-radius:10px; overflow:hidden;
    border:1px solid var(--border);
  }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb .remove-btn{
    position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,0.6); color:#fff; border:none; font-size:13px; line-height:20px;
    text-align:center; cursor:pointer; padding:0;
  }
  .photo-add-tile{
    aspect-ratio:1.586/1; border-radius:10px; border:1.5px dashed var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--primary);
    font-size:22px; cursor:pointer; background:var(--bg);
  }

  .tile-img-count{
    position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.6); color:#fff;
    font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:20px;
  }
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px;
    border-radius:50%; background:rgba(255,255,255,0.15); color:#fff; border:none;
    font-size:20px; cursor:pointer; display:none;
  }
  .lightbox-nav.prev{ left:12px; } .lightbox-nav.next{ right:12px; }
  .lightbox-dots{
    position:absolute; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:0; right:0;
    display:flex; justify-content:center; gap:6px;
  }
  .lightbox-dots span{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.35); }
  .lightbox-dots span.active{ background:#fff; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="5" width="20" height="14" rx="2.5" fill="#FAFAF7"/>
        <rect x="2" y="9" width="20" height="3" fill="#1B1A4D"/>
        <circle cx="18" cy="16.5" r="3.2" fill="#12B76A"/>
        <path d="M16.4 16.5l1.1 1.1 2-2.1" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">CardWise</div>
      <div class="brand-sub">Type kar, best card turant mil jayega</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabRecommend" data-tab="recommend">Best Card</button>
    <button class="tab-btn" id="tabMyCards" data-tab="mycards">My Cards</button>
  </div>
  <div class="search-wrap" id="searchWrap">
    <input type="text" id="searchInput" placeholder="Swiggy, MMT, insurance, fuel..." autocomplete="off">
    <button class="clear-btn" id="clearBtn">&times;</button>
  </div>
</header>

<main>
  <div id="recommendView">
    <div class="top-note" id="topNote">Offers change often — jo entry purani lage, usse tap karke edit kar do.</div>
    <div id="results"></div>
  </div>

  <div id="myCardsView" style="display:none;">
    <div class="top-note">Apne saare cards yahan add karo — image, network, fee, sab ek jagah.</div>
    <div id="cardsGrid"></div>
  </div>
</main>

<button class="fab" id="addBtn" aria-label="Add">+</button>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">Add entry</h2>
    <div class="field">
      <label>Kis cheez ke liye (name)</label>
      <input type="text" id="fName" placeholder="e.g. IKEA shopping">
    </div>
    <div class="field">
      <label>Section</label>
      <input type="text" id="fSection" list="sectionList" placeholder="e.g. Shopping">
      <datalist id="sectionList"></datalist>
    </div>
    <div class="field">
      <label>Recommended card / mode</label>
      <input type="text" id="fMode" placeholder="e.g. Amazon Pay ICICI">
    </div>
    <div class="field">
      <label>Rate / benefit tag (chhota)</label>
      <input type="text" id="fRate" placeholder="e.g. 5%">
    </div>
    <div class="field">
      <label>Note (optional)</label>
      <textarea id="fNote" placeholder="Cap, condition, kuch bhi extra detail"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none;">
      <button class="btn btn-danger" id="deleteBtn">Delete this entry</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="cardSheetBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="cardSheetTitle">Add card</h2>

    <label>Card ki photos (front, back, jitni chahiye)</label>
    <div class="photo-grid" id="photoGrid"></div>
    <input type="file" id="cImgInput" accept="image/*" multiple style="display:none;">

    <div class="field">
      <label>Card ka naam</label>
      <input type="text" id="cName" placeholder="e.g. Swiggy HDFC Card">
    </div>
    <div class="field">
      <label>Bank / Issuer</label>
      <input type="text" id="cBank" placeholder="e.g. HDFC Bank">
    </div>
    <div class="field">
      <label>Network</label>
      <select id="cNetwork">
        <option>Visa</option>
        <option>Mastercard</option>
        <option>RuPay</option>
        <option>American Express</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>Last 4 digits (optional)</label>
      <input type="text" id="cLast4" placeholder="e.g. 4417" maxlength="4" inputmode="numeric">
    </div>
    <div class="field">
      <label>Annual fee / waiver condition</label>
      <input type="text" id="cFee" placeholder="e.g. ₹500, waived on ₹2L spend">
    </div>
    <div class="field">
      <label>Key benefit (one line)</label>
      <textarea id="cBenefit" placeholder="e.g. 10% cashback on Swiggy app, cap ₹1,500/cycle"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="cSaveBtn">Save</button>
    </div>
    <div class="sheet-actions" id="cDeleteRow" style="display:none;">
      <button class="btn btn-danger" id="cDeleteBtn">Delete this card</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <button class="lightbox-nav prev" id="lightboxPrev">&#8249;</button>
  <img id="lightboxImg" src="" alt="Card photo">
  <button class="lightbox-nav next" id="lightboxNext">&#8250;</button>
  <div class="lightbox-dots" id="lightboxDots"></div>
</div>

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){}
  }
  const seeded = [];
  let id = 1;
  DEFAULT_DATA.forEach(([section, items])=>{
    items.forEach(([name, mode, rate, note])=>{
      seeded.push({ id: id++, section, name, mode, rate, note, custom:false });
    });
  });
  saveData(seeded);
  return seeded;
}
function saveData(d){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}

const fSection = document.getElementById('fSection');

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 1600);
}

function uniqueSections(){
  return [...new Set(data.map(d=>d.section))];
}

function scoreItem(item, q){
  const name = item.name.toLowerCase();
  const mode = (item.mode||'').toLowerCase();
  if(name.startsWith(q)) return 0;
  if(name.includes(q)) return 1;
  if(mode.startsWith(q)) return 2;
  if(mode.includes(q)) return 3;
  if((item.section||'').toLowerCase().includes(q)) return 4;
  if((item.note||'').toLowerCase().includes(q)) return 5;
  return 6;
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  searchWrap.classList.toggle('has-val', q.length>0);

  if(q.length === 0){
    resultsEl.innerHTML = `<div class="empty-state">
      <div class="glyph">⌨️</div>
      <p><strong>Type karo apna use case</strong></p>
      <p>e.g. "Swiggy", "MMT", "insurance" — best card turant dikh jayega.</p>
    </div>`;
    return;
  }

  let filtered = data.filter(d => (d.name+' '+d.mode+' '+d.section+' '+(d.note||'')).toLowerCase().includes(q));

  if(filtered.length === 0){
    resultsEl.innerHTML = `<div class="empty-state">
      <div class="glyph">🔍</div>
      <p><strong>Kuch nahi mila</strong></p>
      <p>Naya add karne ke liye neeche + dabao.</p>
    </div>`;
    return;
  }

  filtered.sort((a,b)=> scoreItem(a,q) - scoreItem(b,q));
  const top = filtered.slice(0, 2);

  let html = '';
  top.forEach(item=>{
    html += `<div class="result-card" data-id="${item.id}">
      <div class="result-top">
        <div class="result-mode">${escapeHtml(item.mode)}</div>
        ${item.rate ? `<div class="item-badge mono">${escapeHtml(item.rate)}</div>` : ''}
      </div>
      <div class="result-for">${escapeHtml(item.name)}${item.custom ? '<span class="custom-tag">Custom</span>' : ''}</div>
      ${item.note ? `<div class="item-note">${escapeHtml(item.note)}</div>` : ''}
    </div>`;
  });
  resultsEl.innerHTML = html;

  document.querySelectorAll('.result-card').forEach(el=>{
    el.addEventListener('click', ()=> openEdit(parseInt(el.dataset.id)));
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function refreshSectionList(){
  sectionList.innerHTML = uniqueSections().map(s=>`<option value="${escapeHtml(s)}"></option>`).join('');
}

  editingId = null;

function openEdit(id){
  const item = data.find(d=>d.id===id);
  if(!item) return;
  editingId = id;
  sheetTitle.textContent = 'Edit entry';
  fName.value = item.name;
  fSection.value = item.section;
  fMode.value = item.mode;
  fRate.value = item.rate || '';
  fNote.value = item.note || '';
  deleteRow.style.display = 'flex';
  refreshSectionList();
  sheetBackdrop.classList.add('open');
}

function closeSheet(){
  sheetBackdrop.classList.remove('open');
}

function save(){
  const name = fName.value.trim();
  const section = fSection.value.trim() || 'Mera Apna';
  const mode = fMode.value.trim();
  const rate = fRate.value.trim();
  const note = fNote.value.trim();

  if(!name || !mode){
    showToast('Naam aur card dono chahiye');
    return;
  }

  if(editingId){
    const item = data.find(d=>d.id===editingId);
    item.name = name; item.section = section; item.mode = mode; item.rate = rate; item.note = note;
    showToast('Update ho gaya');
  } else {
    const newId = data.length ? Math.max(...data.map(d=>d.id))+1 : 1;
    data.push({ id:newId, section, name, mode, rate, note, custom:true });
    showToast('Add ho gaya');
  }
  saveData(data);
  closeSheet();
  render();
}

function del(){
  if(!editingId) return;
  data = data.filter(d=>d.id!==editingId);
  saveData(data);
  closeSheet();
  render();
  showToast('Delete ho gaya');
}

const lightbox = document.getElementById('lightbox');

const lightboxNext = document.getElementById('lightboxNext');

function renderLightbox(){
  lightboxImg.src = lightboxImages[lightboxIndex];
  const multi = lightboxImages.length > 1;
  lightboxPrev.style.display = multi ? 'block' : 'none';
  lightboxNext.style.display = multi ? 'block' : 'none';
  lightboxDots.innerHTML = multi
    ? lightboxImages.map((_, i)=> `<span class="${i===lightboxIndex ? 'active' : ''}"></span>`).join('')
    : '';

  lightboxImages = images;
  lightboxIndex = startIndex || 0;
  renderLightbox();
  lightbox.classList.add('open');
}
function closeLightbox(){ lightbox.classList.remove('open'); lightboxImg.src=''; }
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
lightboxPrev.addEventListener('click', (e)=>{
  e.stopPropagation();
  lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
  renderLightbox();
});
lightboxNext.addEventListener('click', (e)=>{
  e.stopPropagation();
  lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
  renderLightbox();
});

function closeCardSheet(){ cardSheetBackdrop.classList.remove('open'); }

function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

cImgInput.addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files);
  for(const file of files){
    const compressed = await compressImage(file);
    pendingImages.push(compressed);
  }
  renderPhotoGrid();
  cImgInput.value = '';
});

function saveCard(){
  const name = cName.value.trim();
  if(!name){ showToast('Card ka naam daalo'); return; }
  const payload = {
    name, bank: cBank.value.trim(), network: cNetwork.value, last4: cLast4.value.trim(),
    fee: cFee.value.trim(), benefit: cBenefit.value.trim(), images: pendingImages
  };
  let isNew = false;
  let newId = null;
  if(editingCardId){
    const c = myCards.find(x=>x.id===editingCardId);
    Object.assign(c, payload);
  } else {
    isNew = true;
    newId = myCards.length ? Math.max(...myCards.map(x=>x.id))+1 : 1;
    myCards.push({ id:newId, ...payload });
  }
  const ok = saveCards();
  if(!ok){
    if(isNew) myCards = myCards.filter(x=>x.id!==newId);
    return;
  }
  showToast(editingCardId ? 'Card update ho gaya' : 'Card add ho gaya');
  closeCardSheet();
  renderCards();
}

function deleteCard(){
  if(!editingCardId) return;
  myCards = myCards.filter(x=>x.id!==editingCardId);
  saveCards();
  closeCardSheet();
  renderCards();
  showToast('Card delete ho gaya');
}
